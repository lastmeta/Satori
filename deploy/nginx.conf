# The browser neuron as a static site (docs/design/deploy.md): the image's
# /etc/nginx/conf.d/default.conf. Plain http on 80: central's nginx-proxy in
# front terminates TLS. csp.conf is the CSP header line, written from csp.js
# when the image is built (deploy/Dockerfile).

# Hashed files never change; everything else is revalidated each time (ETag).
map $uri $satori_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# DuckDB's wasm in brotli where the browser takes it: 5.1 MB, not gzip's 7.7 (docs/design/deploy.md#compression). This
# nginx has no brotli module (brotli_static), so the copy scripts/brotli.mjs made beside the file is picked by the
# request's Accept-Encoding, and its Content-Encoding by the file actually served (a wasm with no .br copy, DuckDB's
# mvp, falls back to gzip_static's .gz, unmarked).
map $http_accept_encoding $satori_br {
    "~*\bbr\b"  ".br";
    default     "";
}
map $uri $satori_encoding {
    "~\.br$"   br;
    default     "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Every response gets these, errors too (`always`). No add_header below this
    # level: one in a location would drop all of these there. HSTS: browsers take
    # it only over https, which the proxy in front adds, passing this header on.
    include csp.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control $satori_cache; # 2xx and 3xx only: a 404 is not kept a year

    # mime.types (nginx 1.30) already has wasm → application/wasm, txt →
    # text/plain (/llms.txt) and js → application/javascript; charset adds
    # utf-8 to text/html, text/plain and JS.
    charset utf-8;

    # The image gzips the build next to itself (deploy/Dockerfile): DuckDB's 34 MB
    # wasm goes as 7.6 MB. The proxy's request counts as proxied, and may be HTTP/1.0.
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;

    location = /manifest.webmanifest {
        default_type application/manifest+json; # not in mime.types
    }

    # A hashed file that is not there is a 404, not the page.
    location /assets/ {
        try_files $uri =404;
    }

    # A wasm: its .br where the browser takes brotli, else the file (gzip_static then sends its .gz). An add_header
    # here drops the server's, so they are repeated; Vary is said here once (gzip_vary would add a second).
    location ~ ^/assets/[^/]+\.wasm$ {
        include csp.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control $satori_cache;
        add_header Content-Encoding $satori_encoding;
        add_header Vary Accept-Encoding;
        gzip_vary off;
        types { }
        default_type application/wasm;
        try_files $uri$satori_br $uri =404;
    }

    # Any other path that is not a file is the app (SPA).
    location / {
        try_files $uri /index.html;
    }
}

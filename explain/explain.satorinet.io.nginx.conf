    # ---------------------------------------------------------------------
    # explain.satorinet.io: the Satori ecosystem overview, a static page in the
    # satori-explain container (nginx:alpine, /root/satori-explain/site mounted
    # read-only). Source and deploy: satori repo, explain/ (explain/deploy.sh).
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name explain.satorinet.io;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name explain.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/explain.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/explain.satorinet.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        set $satori_explain satori-explain;

        location / {
            proxy_pass http://$satori_explain:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
        }
    }
